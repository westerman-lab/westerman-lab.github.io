<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img"
     aria-labelledby="pipelineTitle pipelineDesc">
  <title id="pipelineTitle">How the Westerman Lab works</title>
  <desc id="pipelineDesc">Genetic variation and a modifiable exposure feed into
    genome-wide interaction testing in biobank-scale data. Results branch into
    molecular mechanism and response prediction, which together support
    precision prevention: identifying who benefits most from which change.</desc>

  <style>
    .box   { fill: #f6f7f8; stroke: #dde0e4; stroke-width: 1.5; }
    .gene  { fill: #f1faf6; stroke: #1c9e77; stroke-width: 1.5; }
    .expo  { fill: #fdf5ef; stroke: #d95f02; stroke-width: 1.5; }
    .out   { fill: #ffffff; stroke: #9aa1a9; stroke-width: 2; }
    .t     { font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
             fill: #33373d; text-anchor: middle; }
    .s     { font: 400 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
             fill: #6b7480; text-anchor: middle; }
    .flow  { fill: none; stroke: #b3b9c0; stroke-width: 2; marker-end: url(#tip); }
  </style>

  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3b9c0"/>
    </marker>
  </defs>

  <!-- ── inputs ─────────────────────────────────────────────────────── -->
  <rect class="gene" x="16"  y="70"  width="176" height="86" rx="10"/>
  <text class="t" x="104" y="104">Genetic variation</text>
  <text class="s" x="104" y="126">variants and</text>
  <text class="s" x="104" y="142">polygenic scores</text>

  <rect class="expo" x="16"  y="204" width="176" height="86" rx="10"/>
  <text class="t" x="104" y="238">Exposure</text>
  <text class="s" x="104" y="260">diet, activity,</text>
  <text class="s" x="104" y="276">adiposity</text>

  <!-- ── interaction testing ────────────────────────────────────────── -->
  <rect class="box" x="262" y="115" width="216" height="130" rx="10"/>
  <text class="t" x="370" y="152">Interaction</text>
  <text class="t" x="370" y="174">testing at scale</text>
  <text class="s" x="370" y="200">UK Biobank · All of Us · TOPMed</text>
  <text class="s" x="370" y="220">GEM · METAGEM · REGEM</text>

  <!-- ── two branches ───────────────────────────────────────────────── -->
  <rect class="box" x="548" y="48"  width="204" height="110" rx="10"/>
  <text class="t" x="650" y="88">Mechanism</text>
  <text class="s" x="650" y="112">molecular mediators,</text>
  <text class="s" x="650" y="130">decomposed interaction</text>

  <rect class="box" x="548" y="202" width="204" height="110" rx="10"/>
  <text class="t" x="650" y="242">Prediction</text>
  <text class="s" x="650" y="266">interaction and</text>
  <text class="s" x="650" y="284">pathway-specific PGS</text>

  <!-- ── outcome ────────────────────────────────────────────────────── -->
  <rect class="out" x="822" y="110" width="162" height="140" rx="10"/>
  <text class="t" x="903" y="152">Precision</text>
  <text class="t" x="903" y="174">prevention</text>
  <text class="s" x="903" y="200">who benefits from</text>
  <text class="s" x="903" y="218">which change</text>

  <!-- ── flow ───────────────────────────────────────────────────────── -->
  <path class="flow" d="M 200 113 C 232 113, 230 155, 254 158"/>
  <path class="flow" d="M 200 247 C 232 247, 230 205, 254 202"/>

  <path class="flow" d="M 486 152 C 516 152, 512 105, 540 103"/>
  <path class="flow" d="M 486 208 C 516 208, 512 255, 540 257"/>

  <path class="flow" d="M 760 103 C 790 103, 786 150, 814 152"/>
  <path class="flow" d="M 760 257 C 790 257, 786 210, 814 208"/>
</svg>
