<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img"
     aria-labelledby="pipelineTitle pipelineDesc">
  <title id="pipelineTitle">How the Westerman Lab works</title>
  <desc id="pipelineDesc">Genetic variation and a modifiable exposure feed into
    interaction testing at scale. Results branch into mechanism and prediction,
    which together support precision prevention.</desc>

  <style>
    .box   { fill: #f6f7f8; stroke: #dde0e4; stroke-width: 1.5; }
    .gene  { fill: #f1faf6; stroke: #1c9e77; stroke-width: 1.5; }
    .expo  { fill: #fdf5ef; stroke: #d95f02; stroke-width: 1.5; }
    .out   { fill: #ffffff; stroke: #9aa1a9; stroke-width: 2; }
    .t     { font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
             fill: #33373d; text-anchor: middle; }
    .s     { font: 400 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
             fill: #6b7480; text-anchor: middle; }
    .flow  { fill: none; stroke: #b3b9c0; stroke-width: 2; marker-end: url(#tip); }
  </style>

  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3b9c0"/>
    </marker>
  </defs>

  <!-- ── inputs ─────────────────────────────────────────────────────── -->
  <rect class="gene" x="16"  y="57"  width="176" height="86" rx="10"/>
  <text class="t" x="104" y="91">Genetic variation</text>
  <text class="s" x="104" y="113">variants and</text>
  <text class="s" x="104" y="129">polygenic scores</text>

  <rect class="expo" x="16"  y="197" width="176" height="86" rx="10"/>
  <text class="t" x="104" y="231">Exposure</text>
  <text class="s" x="104" y="253">diet, activity,</text>
  <text class="s" x="104" y="269">adiposity</text>

  <!-- ── interaction testing ────────────────────────────────────────── -->
  <rect class="box" x="262" y="125" width="216" height="90" rx="10"/>
  <text class="t" x="370" y="163">Interaction</text>
  <text class="t" x="370" y="185">testing at scale</text>

  <!-- ── two branches ───────────────────────────────────────────────── -->
  <rect class="box" x="548" y="45"  width="204" height="100" rx="10"/>
  <text class="t" x="650" y="80">Mechanism</text>
  <text class="s" x="650" y="104">molecular mediators,</text>
  <text class="s" x="650" y="122">pathway-specific PGS</text>

  <rect class="box" x="548" y="195" width="204" height="100" rx="10"/>
  <text class="t" x="650" y="238">Prediction</text>
  <text class="s" x="650" y="262">interaction-focused PGS</text>

  <!-- ── outcome ────────────────────────────────────────────────────── -->
  <rect class="out" x="822" y="125" width="162" height="90" rx="10"/>
  <text class="t" x="903" y="163">Precision</text>
  <text class="t" x="903" y="185">prevention</text>

  <!-- ── flow ───────────────────────────────────────────────────────── -->
  <path class="flow" d="M 200 100 C 232 100, 230 148, 254 150"/>
  <path class="flow" d="M 200 240 C 232 240, 230 192, 254 190"/>

  <path class="flow" d="M 486 150 C 516 150, 512  97, 540  95"/>
  <path class="flow" d="M 486 190 C 516 190, 512 243, 540 245"/>

  <path class="flow" d="M 760  95 C 790  95, 786 148, 814 150"/>
  <path class="flow" d="M 760 245 C 790 245, 786 192, 814 190"/>
</svg>
