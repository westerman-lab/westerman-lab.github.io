# Lab members, rendered by _pages/people.md
#
# Three groups, each rendered under its own heading:
#   pi       principal investigator
#   members  current lab members
#   alumni   former members, shown smaller at the bottom of the page
#
# Fields per person:
#   name    (required)
#   role    (required)  e.g. "Principal Investigator", "Analyst", "Student"
#   image   (optional)  filename in /images/, e.g. "kew_headshot.jpg"
#                       filenames are case-sensitive once deployed
#                       omit to show an initials placeholder instead
#   blurb   (optional)  1-2 sentences, or a link; markdown is rendered
#   email   (optional)
#   github / scholar / orcid / linkedin / website  (optional)  full URLs
#
# `website` renders as the first link under a person's name. On the PI entry
# it points at /pi/ and is labelled "Bio & CV"; elsewhere it reads "Website".
#
# Alumni entries read only name, role, image, and next (where they went after
# the lab); blurbs and links are ignored there.
#
# Order within each group is the order shown on the page.

